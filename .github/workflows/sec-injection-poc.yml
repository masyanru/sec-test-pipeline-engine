name: Injection PoC (vulnerable on purpose)
run-name: "Injection PoC"

# This workflow REPRODUCES the vulnerable pattern from
# toloka-partners/project-pipeline-ots/.github/workflows/skip-step.yml line 64
#
# It is intentionally vulnerable. Do NOT copy this pattern to real code.
# Run it only in a throwaway sandbox repo (masyanru/sec-test-pipeline-engine).

on:
  workflow_dispatch:
    inputs:
      external_id:
        required: false
        default: 'no-id'
        description: 'Correlation id'
      domain:
        required: true
        description: 'Domain name. Vulnerable point - this value is interpolated directly into a shell command.'

concurrency:
  group: injection-poc
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Define a fake secret simulating a real APP_PRIVATE_KEY
        env:
          FAKE_SECRET: 'sk_fake_super_secret_value_DO_NOT_PANIC_this_is_a_demo_token'
        run: |
          echo "FAKE_SECRET length: ${#FAKE_SECRET}"
          echo "FAKE_SECRET=$FAKE_SECRET" >> "$GITHUB_ENV"

      - name: Vulnerable step - pattern from skip-step.yml line 64
        run: |
          git add "domains/${{ inputs.domain }}/pipeline_state.yaml" || true
          echo "step finished normally"

      - name: Job summary
        run: |
          echo "## Injection PoC complete" >> "$GITHUB_STEP_SUMMARY"
          echo "run url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
